; PlatformIO Project Configuration File
;
; MKS SERVO42C closed-loop stepper control over UART from an ESP32.
;
; The servo is on UART2 (GPIO17 = TX, GPIO16 = RX); UART0 stays free for
; flashing and the serial monitor. See include/servo_config.h.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; Serial monitor on UART0 over USB. This is the ESP-IDF log console and is
; unrelated to the 19200 baud servo link.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
