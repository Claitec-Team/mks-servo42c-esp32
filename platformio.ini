; PlatformIO Project Configuration File
;
; MKS SERVO42C closed-loop stepper control over UART from an ESP32.
;
; The servo is on UART2 (GPIO17 = TX, GPIO16 = RX); UART0 stays free for
; flashing and the serial monitor. See include/servo_config.h.
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = espidf

; Serial monitor on UART0 over USB. This is the ESP-IDF log console and is
; unrelated to the 19200 baud servo link.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; WiFi credentials come from the environment so they stay out of the repo:
;   export WIFI_CLAITEC_SSID='your-ssid'
;   export WIFI_CLAITEC_PASS='your-password'
; The script writes include/wifi_credentials.h (gitignored) before each build.
; With the variables unset the SSID is empty and the radio stays off.
extra_scripts = pre:scripts/wifi_credentials.py

; Normal firmware: control console over serial, and over TCP when WiFi is set.
[env:esp32dev]

; Link diagnostics instead of the demo. Sweeps baud rates, slave addresses and
; both framing variants, and dumps every raw byte the servo sends back.
;   pio run -e diag -t upload && pio device monitor -e diag
[env:diag]
build_flags = -DRUN_DIAGNOSTICS=1
